name: Bug report
description: Something is wrong or unexpected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command, flags, and a minimal manifest if relevant. Do not paste tokens or secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kedgeway version
      placeholder: "0.1.0 or commit sha"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22.x, macOS 15"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / logs
      render: text
